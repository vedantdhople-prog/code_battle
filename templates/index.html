<!DOCTYPE html>
<html>
<head>
    <title>Simple Chatbot</title>
    <style> 
        #chatbox {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 300px;
            height: 400px;
            border: 1px solid #999;
            border-radius: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            font-family: Arial;
            font-size: 14px;
        }

        #inputBar {
            display: flex;
            gap: 5px;
        }

        #userInput {
            flex: 1;
            padding: 5px;
        }

        button {
            padding: 5px;
        }
    </style>
</head>
<body>

<div id="chatbox">
    <div id="messages"></div>

    <div id="inputBar">
        <input id="userInput" type="text" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messagesDiv = document.getElementById("messages");

        let text = input.value.trim();
        if (!text) return;

        messagesDiv.innerHTML += "<div><b>You:</b> " + text + "</div>";
        input.value = "";

        const response = await fetch("http://localhost:1111/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: text,
                grade: "8",
                name: "User"
            })
        });

        const data = await response.json();

        messagesDiv.innerHTML += "<div><b>Bot:</b> " + data.reply + "</div>";
    }
</script>

</body>
</html>
